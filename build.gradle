plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.1.36'
    id 'com.matthewprenger.cursegradle' version '1.4.0'
}

apply plugin: 'maven-publish'

version = "$minecraft_version-$mod_version"
group = 'com.smashingmods'
archivesBaseName = 'alchemylib'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Wire AlchemyLib's access transformer into the NeoGradle build.
// Opens Ingredient.values (Mojmap name on NeoForge, so referenced directly with no SRG step) so
// IngredientStack can read it directly.
minecraft {
    accessTransformers {
        file 'src/main/resources/META-INF/accesstransformer.cfg'
    }
}

// Default run configurations.
// These can be tweaked, removed, or duplicated as needed.
runs {
    // applies to all the run configs below
    configureEach { run ->
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main

        // Auto-accept the Minecraft EULA for dev runs. The dedicated server (and any run that
        // boots server-side logic) refuses to start until eula.txt reads "eula=true"; without this
        // every fresh run dir stops at the EULA prompt. We write the flag into each run's own
        // working directory just before launch so it is always present and never needs manual
        // acceptance. Dev/test only -- this is not redistributed and does not touch a user install.
        def runName = run.name.capitalize()
        def acceptEula = project.tasks.register("acceptEula${runName}") {
            def eulaFile = run.workingDirectory.file('eula.txt')
            outputs.file(eulaFile)
            doLast {
                def target = eulaFile.get().asFile
                target.parentFile.mkdirs()
                target.text = "# Auto-generated by the acceptEula${runName} Gradle task for dev runs.\n" +
                        "# Indicates agreement to the Minecraft EULA (https://aka.ms/MinecraftEULA).\n" +
                        "eula=true\n"
            }
        }
        run.dependsOn acceptEula.get()
    }

    client { run ->
        // NeoGradle 7.1 no longer infers a run's type from the block name; declare it explicitly.
        runType "client"

        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id

        // Silent dev client: stamp a sound-off options.txt into the client run's working directory just
        // before launch so client runs always start with every sound category at 0.0 and never blast audio
        // while working. Same per-run, write-into-working-directory approach as the EULA task above; the
        // template is overwritten on purpose each run since these are throwaway dev runs.
        def silentOptions = project.tasks.register('prepareSilentClientOptions', Copy) {
            from project.file('run-config/options.txt')
            into run.workingDirectory
        }
        run.dependsOn silentOptions.get()
    }

    server {
        runType "server"
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        runType "gameTestServer"
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        runType "data"
        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven { url "https://maven.blamejared.com/" }
    maven { url "https://maven.tamaized.com/releases" }
    // JUnit (org.junit.*) is not mirrored by the repos above; settings.gradle has no
    // dependencyResolutionManagement, so the test deps need Maven Central here.
    mavenCentral()
}

dependencies {
    // Specify the version of Minecraft to use. NeoGradle treats this dependency as if it were a normal library.
    implementation "net.neoforged:neoforge:${neo_version}"

    // Consume ChemLib from mavenLocal. NeoGradle remaps mod dependencies declared with a plain configuration, so no 'mod' prefix is needed.
    implementation "smashingmods:chemlib:${minecraft_version}-${chemlib_version}"

    // JUnit 5 for the plain-JUnit `test` source set. testImplementation extends implementation,
    // so the Minecraft classpath (net.neoforged:neoforge above) is inherited by the test compile/runtime.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) { useJUnitPlatform() }

def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
def replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, neo_version_range: neo_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
        chemlib_version: chemlib_version
]
processResources {
    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "$archivesBaseName",
                "Specification-Vendor"    : "SmashingMods",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "SmashingMods",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

def secrets = new Properties()
file('secrets.properties').withInputStream {
    stream -> secrets.load(stream)
}

fileTree("secrets").matching {
    include "**/*.properties"
}.each {
    File file ->
        file.withInputStream {
            stream -> secrets.load(stream)
        }
}

java {
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            afterEvaluate {
                artifact project.jar
                artifact project.sourcesJar
                artifact project.javadocJar
            }
            setGroupId 'smashingmods'
            setArtifactId 'alchemylib'
        }
    }
    repositories {
        maven {
            url "https://maven.tamaized.com/releases"
            credentials {
                username secrets.getProperty("maven_username")
                password secrets.getProperty("maven_password")
            }
        }
    }
}

// The cursegradle plugin reads apiKey at configuration time and aborts the whole build
// ("apiKey not set for project 293426") when it is absent, which would block build/runData on
// machines without publish credentials -- so it stays commented out until that key is configured.
// TODO: re-enable CurseForge publishing once an apiKey is configured in secrets.properties.
/*
curseforge {
    apiKey = secrets.getProperty("apiKey")
    project {
        id = '293426'
        releaseType = 'release'
        changelogType = 'markdown'
        changelog = file("changelog.md")
        addGameVersion 'Java 17'
        mainArtifact(jar) {
            displayName = "AlchemyLib - $project.version"
            relations {
                requiredDependency 'chemlib'
            }
        }
    }
}
*/

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
